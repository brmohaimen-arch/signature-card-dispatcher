# Signature Card Dispatcher settings.
# Secrets are NOT stored here: set SFTP_PASSWORD and/or SFTP_KEY_PASSPHRASE as environment variables.

# production = real onboarding API + both SFTP servers. Local test modes are refused here;
# testing uses its own file (see application-test.example.properties).
profile=production

work.dir=work
template.dir=templates/BM-AC008-2026
font.regular=fonts/Almarai-Regular.ttf
font.bold=fonts/Almarai-Bold.ttf

# How often to look for new input and pending cards.
poll.seconds=30
# Failed sends are retried each cycle; after this many attempts the card moves to work/failed/.
dispatch.max.attempts=5
jpeg.quality=0.95


# T24 document repository (SFTP). Fill in when the bank provides the test server details.
sftp.host=
sftp.port=22
sftp.user=
sftp.remote.dir=
# The T24 server's host key, pinned. For a non-standard port the entry is: [host]:port ssh-ed25519 AAAA...
sftp.known.hosts=config/known_hosts
# Private key for key-based login (leave empty to use SFTP_PASSWORD).
sftp.key.path=
sftp.timeout.seconds=30

# --- Onboarding API (customer lookup; NOT T24) ---------------------------------------------------------------------
# account details by national ID + passport + phone -> account number, customer name, branch code.
# The card gets the ARABIC part of the name. Branch: the Arabic name saved in the dashboard's branch table;
# if none is saved yet, the English name from getBranches.
# The onboarding API server, e.g. http://<host>:<port> (bank network only). Set it here or in the dashboard.
api.base.url=
api.account.path=/irf-itss-container/api/v1.0.0/holdings/customer/account/details/{nationalId}/{passportNumber}/{phoneNumber}
# Fields in the account details response (JSON pointers), from the real response.
api.account.number.pointer=/body/0/accountNumber
api.name.pointer=/body/0/accountName
api.branch.pointer=/body/0/branch
# getBranches: every branch's code (companyId) and English name (displayName), fetched at most once an hour.
api.branches.path=/irf-itss-container/api/v1.0.0/holdings/getBranches
api.branches.list.pointer=/body
api.branches.code.field=companyId
api.branches.name.field=displayName
# Branch code -> Arabic name, edited from the dashboard (Configuration -> Branch names on the card).
branches.file=config/branches.properties
# If the API needs an auth header, name it here; the value comes from the API_AUTH_VALUE environment variable.
api.auth.header=
# The real account call takes ~14 s.
api.timeout.seconds=45

# --- Input file safety: checked from the file size and image header BEFORE the file is opened --------
# A file over these limits is suspicious: it is encrypted into work/quarantine/ and our copy is deleted.
# The app's images are BMP (uncompressed): a phone photo is ~20-40 MB.
image.max.bytes=40000000
image.max.side=10000
image.max.pixels=50000000

# --- Our endpoint for the onboarding app (internal network, no key) ---------------------------------
# POST /api/v1/signature-cards  {"nationalId","passportNumber","phoneNumber"} + X-Request-Id header or "requestId"
server.bind=0.0.0.0
server.port=8085
# false = the endpoint answers 503 DISABLED (switch it from the dashboard Overview).
endpoint.enabled=true

# --- Onboarding SFTP the selfie + signature are READ from (never written or deleted) -----------------
# PLACEHOLDER: fill in when the bank provides it. Password from SOURCE_SFTP_PASSWORD.
source.sftp.host=
source.sftp.port=22
source.sftp.user=
source.sftp.known.hosts=config/source_known_hosts
source.sftp.key.path=
source.sftp.timeout.seconds=30
# Where a customer's files are. The app's layout (OCR_Uploads):
#   {root}/{branch3}/{nationalId}_{accountNumber}_{trace number}[_OpenNewBankAccount]/Profile.bmp, SignatureCard.bmp, ...
# {branch3} = last 3 characters of the branch code (LY0010009 -> 009). * = anything (the trace number, which changes).
# If several folders match, the newest is used. Passport / BirthCertificate in the folder are ignored.
source.root=
source.folder.pattern={branch3}/{nationalId}_{accountNumber}_*
source.selfie.file=Profile
source.signature.file=SignatureCard

# TEST profile: the whole flow on one PC. Copy to local-test/local.properties and run with
#   java -jar target/signature-card-dispatcher.jar --config local-test/local.properties serve
# It has its OWN port, work folder, branch table and secrets (secrets.enc next to this file),
# so nothing here touches production. The dashboard shows a permanent TEST PROFILE banner.
profile=test
work.dir=local-test/work
template.dir=templates/BM-AC008-2026
font.regular=fonts/Almarai-Regular.ttf
font.bold=fonts/Almarai-Bold.ttf
poll.seconds=30
dispatch.max.attempts=5
jpeg.quality=0.95
branches.file=local-test/branches.properties
image.max.bytes=40000000

server.bind=127.0.0.1
server.port=8090
endpoint.enabled=true

# real = the bank's onboarding API (set api.base.url); local = the two JSON files below.
api.mode=local
api.base.url=
api.local.customers.file=local-test/test-customers.json
api.local.branches.file=local-test/test-branches.json
api.timeout.seconds=45

# local = read the app's images from a local copy of OCR_Uploads (same layout); sftp = the onboarding SFTP.
source.mode=local
source.local.root=local-test/OCR_Uploads
source.folder.pattern={branch3}/{nationalId}_{accountNumber}_*
source.selfie.file=Profile
source.signature.file=SignatureCard

# local = write finished cards to this folder; sftp = the T24 SFTP.
t24.mode=local
t24.local.dir=local-test/T24_out
